name: Windows deploy
run-name: Windows deploy
on:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies and build tools
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Audit runtime dependency vulnerabilities
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit -r requirements.txt --strict
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Run frontend model tests
        run: node --test tests/frontend.test.mjs
      - name: Collect dependency and Python license notices
        run: python tools/collect_licenses.py
      - name: Add Windows version resource
        run: python tools/write_version_resource.py
      - name: Build desktop application
        run: python -m PyInstaller --noconfirm packaging/iR-Board.spec
      - name: Read version and validate release tag
        id: version
        shell: pwsh
        run: |
          $version = python -c "from irboard.version import VERSION; print(VERSION)"
          $displayVersion = python -c "from irboard.version import DISPLAY_VERSION; print(DISPLAY_VERSION)"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must match irboard/version.py ($version)"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "APP_DISPLAY_VERSION=$displayVersion" >> $env:GITHUB_ENV
          "app_version=$displayVersion" >> $env:GITHUB_OUTPUT
      - name: Compile Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup 6 is missing from this runner" }
          & $compiler "/DAppVersion=$env:APP_VERSION" "/DAppDisplayVersion=$env:APP_DISPLAY_VERSION" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
      - name: Installer smoke test
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/installer/*.exe | Select-Object -First 1
          $target = "$env:RUNNER_TEMP\iR-BoardInstalled"
          Start-Process -FilePath $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$target" -Wait
          $app = Start-Process "$target\iR-Board.exe" -ArgumentList '--demo' -PassThru
          try {
            $healthy = $false
            for ($i=0; $i -lt 30; $i++) {
              try {
                $snapshot = Invoke-RestMethod http://127.0.0.1:8000/api/telemetry
                if ($snapshot.connected -and $snapshot.mode -eq 'demo') { $healthy=$true; break }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (!$healthy) { throw "Installed application did not provide demo telemetry" }
            if ($snapshot.sectors.Count -ne 7 -or !$snapshot.coaching.references.session) {
              throw "Installed application did not provide experimental coaching demo data"
            }
            $module = Invoke-WebRequest http://127.0.0.1:8000/experimental.mjs
            if ($module.Content -notmatch 'sectorState') {
              throw "Installed coaching widgets are missing"
            }
            $buttonModule = Invoke-WebRequest http://127.0.0.1:8000/buttonbox.mjs
            if ($buttonModule.Content -notmatch 'refreshButtonbox') { throw "Installed button box widget is missing" }
            $press = @{ action = 'ignition'; key = 'F13'; phase = 'tap'; press_id = 'installer-smoke-ignition' } | ConvertTo-Json
            $pressed = Invoke-RestMethod http://127.0.0.1:8000/api/buttonbox -Method Post -ContentType 'application/json' -Body $press
            if ($pressed.status -ne 'demo') { throw "Installed DEMO button box sent real input" }
            $connection = Invoke-RestMethod http://127.0.0.1:8000/api/connection
            if (!$connection.urls.Count) { throw "Installed application did not detect a LAN address" }
            $url = [uri]::EscapeDataString($connection.urls[0])
            $qr = Invoke-WebRequest "http://127.0.0.1:8000/qr.svg?url=$url"
            if ($qr.Content -notmatch '<svg') { throw "QR code generation failed" }
            $currentLayout = Invoke-RestMethod http://127.0.0.1:8000/api/layout
            $layout = @{ pages = @(@{ name = 'Upgrade persistence'; widgets = @(@{ type = 'tachometer'; hidden = @('oil'); colors = @{ rpm = '#123456' }; shiftLights = @{ style = 'dots'; dots = 24 } }, @{ type = 'irlogic'; coachReference = 'personal' }) }); theme = 'custom'; customTheme = @{ accent = '#ee8833' } }
            $body = @{ revision = $currentLayout.revision; layout = $layout } | ConvertTo-Json -Depth 20
            $saved = Invoke-RestMethod http://127.0.0.1:8000/api/layout -Method Post -ContentType 'application/json' -Body $body
            Stop-Process -Id $app.Id -Force
            Start-Process -FilePath $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$target" -Wait
            $app = Start-Process "$target\iR-Board.exe" -ArgumentList '--demo' -PassThru
            $restored = $null
            for ($i=0; $i -lt 30; $i++) {
              try { $restored = Invoke-RestMethod http://127.0.0.1:8000/api/layout; break } catch { Start-Sleep -Seconds 1 }
            }
            if ($restored.layout.pages[0].widgets.Count -ne 2 -or $restored.layout.pages[0].widgets[1].coachReference -ne 'personal') {
              throw "Installer update did not preserve experimental coaching widgets"
            }
            if (!$restored -or $restored.revision -ne $saved.revision -or $restored.layout.theme -ne 'custom' -or $restored.layout.customTheme.accent -ne '#ee8833' -or $restored.layout.pages[0].widgets[0].shiftLights.dots -ne 24) {
              throw "Installer update did not preserve dashboard appearance"
            }
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Add SHA-256 checksum
        shell: pwsh
        run: |
          Get-ChildItem dist/installer/*.exe | ForEach-Object {
            $hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - name: Stage immutable release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/publish | Out-Null
          Copy-Item dist/installer/*.exe dist/publish/
          Copy-Item dist/installer/*.sha256 dist/publish/
      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iR-Board-Windows
          path: dist/publish/
          if-no-files-found: error
  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: iR-Board-Windows
          path: release
      - name: Publish Windows installer
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: iR-Board ${{ github.ref_name }}
          prerelease: false
          body: |
            iR-Board v1.1.0 — Button box for Windows x64.
            Download the setup EXE under Assets. Python and the iRacing SDK adapter are included.

            - New optional Button box widget: ignition, starter, pit limiter, lights, wipers, radio, brake bias, TC and ABS.
            - Large function icons, telemetry-confirmed state colors, live adjustment values and tap / hold feedback.
            - Configurable keyboard bindings, synchronized with your widget layout. Match them to iRacing controls.
            - Foreground simulator checks and automatic release of held keys after focus or connection loss.
            - DEMO previews the widget without sending input. Existing layouts and saved learning data are preserved.

            Use a trusted private LAN. HTTP traffic is not encrypted. Do not expose the dashboard to the Internet.
            License: MIT. Third-party components retain their own licenses.

            The Windows installer is unsigned. Its SHA-256 checksum is attached.
            Dependency auditing, automated tests and an installed-application smoke test must pass before publication.
            Live iRacing keyboard input, telemetry and PIT-service acceptance require verification in a Windows practice session.
          files: |
            release/*.exe
            release/*.sha256
          fail_on_unmatched_files: true
